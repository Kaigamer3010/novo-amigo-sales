
<main>
  <div class="head">
    <h1>Dia da semana: {{ diaAtual?.nome }}</h1>
  </div>

  <div class="subMain">
    <div class="dias">
      <button
        class="inicialDaSemana"
        *ngFor="let dia of dias"
        (click)="selecionarDia(dia.dia_semana)"
        [class.diaSelecionado]="dia.dia_semana === diaSelecionado">

        {{ dia.letra }}
      </button>
    </div>

    <div class="conteudo">
      <ng-container *ngIf="horariosDoDia.length > 0; else semAulas">
        <div
          class="aula"
          *ngFor="let horario of horariosDoDia">

          <span class="hora">
            {{ horario.hora_inicio }}
          </span>

          <span class="materia">
            {{ horario.materia }}
          </span>

        </div>
      </ng-container>

      <ng-template #semAulas>
        <p class="sem-aulas">
          Nenhuma aula cadastrada para este dia.
        </p>
      </ng-template>
    </div>
  </div>
</main>
