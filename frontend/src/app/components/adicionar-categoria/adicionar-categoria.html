
<main>
  <div class="tituloCategoria">
    <h2>ADICIONAR CATEGORIA</h2>
  </div>

  <form class="conteudoCategoria" (ngSubmit)="salvarCategoria()">
    <label for="nomeCategoria">
      Nome da categoria
    </label>

    <input
      id="nomeCategoria"
      name="nomeCategoria"
      type="text"
      placeholder="Digite o nome da categoria"
      [(ngModel)]="nomeCategoria"
      [disabled]="salvando"
      required>

    @if (erro) {
      <p class="mensagemErro">{{ erro }}</p>
    }

    <div class="botoesCategoria">
      <button
        class="botaoCancelar"
        type="button"
        [disabled]="salvando"
        (click)="cancelar()">
        Cancelar
      </button>

      <button
        class="botaoGerenciar"
        type="button"
        [disabled]="salvando"
        (click)="gerenciarCategorias()">
        Gerenciar categorias
      </button>

      <button
        class="botaoSalvar"
        type="submit"
        [disabled]="salvando">
        {{ salvando ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </form>
</main>
