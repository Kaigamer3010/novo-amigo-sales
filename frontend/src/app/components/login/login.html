
<div class="login-container">

  <div class="login-header">
    <h2>JORNAL SALES</h2>
    <p>Bem-vindo de volta!</p>
    <span>Entre na sua conta para continuar.</span>
  </div>

  <form (ngSubmit)="entrar()">

    <div class="campo">
      <label for="nome_usuario">Nome de usuário</label>
      <input
        type="text"
        id="nome_usuario"
        name="nome_usuario"
        [(ngModel)]="login.nome_usuario"
        placeholder="Digite seu nome de usuário"
        required
      />
    </div>

    <div class="campo">
  <label for="senha">Senha</label>

  <div class="senha-container">
    <input
      [type]="mostrarSenha ? 'text' : 'password'"
      id="senha"
      name="senha"
      [(ngModel)]="login.senha"
      placeholder="Digite sua senha"
      required
    />

    <button
      type="button"
      class="btn-mostrar-senha"
      (click)="mostrarSenha = !mostrarSenha"
      [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
      [attr.aria-pressed]="mostrarSenha"
    >
      <span aria-hidden="true">
  @if (mostrarSenha) {
    <img src="images/eye-close-up.png" alt="" />
  } @else {
    <img src="images/closed-eyes.png" alt="" />
  }
</span>
    </button>
  </div>
</div>

    <button type="submit" class="btn-entrar">
      ENTRAR
    </button>

  </form>

  <div class="login-footer">
    <p>
      Não tem uma conta?
      <a href="#" (click)="abrirCadastro($event)">
        Cadastre-se
      </a>
    </p>
  </div>

</div>
