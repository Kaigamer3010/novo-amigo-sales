<div class="cadastro-container">

  <div class="cadastro-header">
    <h2>JORNAL SALES</h2>
    <h3>Crie sua conta</h3>
    <p>Preencha seus dados para acessar o jornal da escola.</p>
  </div>

  <form #formCadastro="ngForm"
        (ngSubmit)="cadastrar()"
        novalidate>

    <div class="campo">
      <label for="nome_completo">Nome completo</label>
      <input
        type="text"
        id="nome_completo"
        name="nome_completo"
        [(ngModel)]="cadastro.nome_completo"
        placeholder="Digite seu nome completo"
        autocomplete="name"
        required
      />
    </div>

    <div class="campo">
      <label for="nome_usuario">Nome de usuário</label>
      <input
        type="text"
        id="nome_usuario"
        name="nome_usuario"
        [(ngModel)]="cadastro.nome_usuario"
        placeholder="Escolha seu nome de usuário"
        autocomplete="username"
        required
      />
    </div>

    <div class="campo">
      <label for="nivel_acesso">Nível de acesso</label>
      <select
        id="nivel_acesso"
        name="nivel_acesso"
        [(ngModel)]="cadastro.nivel_acesso"
        required
      >
        <option value="" disabled>Selecione o nível de acesso</option>
        <option value="aluno">Aluno</option>
        <option value="administrador">Administrador</option>
        <option value="bibliotecario">Bibliotecário</option>
      </select>
    </div>

    <div class="campo">
      <label for="codigo_acesso">Código de acesso</label>
      <input
        type="password"
        id="codigo_acesso"
        name="codigo_acesso"
        [(ngModel)]="cadastro.codigo_acesso"
        placeholder="Digite o código de acesso"
        autocomplete="off"
        required
      />
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        name="senha"
        [(ngModel)]="cadastro.senha"
        placeholder="Crie uma senha"
        autocomplete="new-password"
        minlength="6"
        required
      />
    </div>

    <div class="campo">
      <label for="confirmarSenha">Confirmar senha</label>
      <input
        type="password"
        id="confirmarSenha"
        name="confirmarSenha"
        [(ngModel)]="cadastro.confirmarSenha"
        placeholder="Digite a senha novamente"
        autocomplete="new-password"
        required
      />
    </div>

    <p
      class="mensagem"
      [hidden]="!mensagem"
      [class.mensagem-erro]="tipoMensagem === 'erro'"
      [class.mensagem-sucesso]="tipoMensagem === 'sucesso'"
      role="alert"
      aria-live="polite"
    >
      {{ mensagem }}
    </p>

    <button
      type="submit"
      class="btn-cadastrar"
      [disabled]="carregando"
    >
      {{ carregando ? 'CRIANDO CONTA...' : 'CRIAR CONTA' }}
    </button>

  </form>

  <div class="cadastro-footer">
    <p>Já tem uma conta?</p>

    <button
      type="button"
      class="link-login"
      (click)="abrirLogin()"
    >
      Voltar ao login
    </button>
  </div>

</div>
