
<main>
  <div class="tituloCategoria">
    <h2>GERENCIAR CATEGORIAS</h2>
  </div>

  <div class="conteudoCategoria">
    @if (erro) {
      <p class="mensagemErro">{{ erro }}</p>
    }

    @if (carregando) {
      <p>Carregando categorias...</p>
    } @else {
      @for (categoria of categorias; track categoria.id) {
        <div class="itemCategoria">
          @if (categoriaEditando === categoria.id) {
            <div class="edicaoCategoria">
              <label [for]="'categoria-' + categoria.id">
                Nome da categoria
              </label>

              <input
                [id]="'categoria-' + categoria.id"
                [name]="'categoria-' + categoria.id"
                type="text"
                [(ngModel)]="novoNome"
                [disabled]="salvando">

              <div class="acoesCategoria">
                <button
                  class="botaoSalvar"
                  type="button"
                  [disabled]="salvando"
                  (click)="salvarEdicao()">
                  {{ salvando ? 'Salvando...' : 'Salvar' }}
                </button>

                <button
                  class="botaoCancelar"
                  type="button"
                  [disabled]="salvando"
                  (click)="cancelarEdicao()">
                  Cancelar
                </button>
              </div>
            </div>
          } @else {
            <span>{{ categoria.genero }}</span>

            <div class="acoesCategoria">
              <button
                class="botaoSalvar"
                type="button"
                [disabled]="salvando"
                (click)="editarCategoria(categoria.id)">
                Editar
              </button>

              <button
                class="botaoExcluir"
                type="button"
                [disabled]="salvando"
                (click)="excluirCategoria(categoria.id)">
                Excluir
              </button>
            </div>
          }
        </div>
      } @empty {
        <p>Nenhuma categoria cadastrada.</p>
      }
    }

    <div class="botoesCategoria">
      <button
        class="botaoCancelar"
        type="button"
        [disabled]="salvando"
        (click)="fechar()">
        Fechar
      </button>
    </div>
  </div>
</main>
