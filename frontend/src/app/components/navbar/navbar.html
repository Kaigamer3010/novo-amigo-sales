<div class="nav">


  <a class="btn-hamburguer" data-bs-toggle="offcanvas" href="#offcanvasExample" role="button"
    aria-controls="offcanvasExample">
    <img id="hamburguer" src="images/hamburger.png" alt="">
  </a>

  <div class="perfil-position">
    @if (auth.usuario$ | async; as usuario) {
    <div class="perfil-login">
      <span>{{ usuario.nome_completo }}</span>
      <button type="button" (click)="sair()">
        Sair
      </button>
    </div>
    } @else {
    <div class="perfil-login">
      <button type="button" (click)="abrirLogin()">
        <img src="images/user.png" alt="Entrar">
      </button>
    </div>
    }
  </div>


  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
    <div class="offcanvas-header">
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <a class="rotas" routerLink="/pg-inicial">
        <ul>PÁGINA INICIAL</ul>
      </a>
      <a class="rotas" routerLink="/pg-jornal">
        <ul>JORNAL</ul>
      </a>
      <a class="rotas" routerLink="/pg-biblioteca">
        <ul>BIBLIOTECA</ul>
      </a>
      @if (auth.temCargo(['aluno'])) {
      <a class="rotas" routerLink="/pg-sala">
        <ul>SALA</ul>
      </a>
      }
      @if (auth.temCargo(['administrador'])) {
      <a class="rotas" routerLink="/editar-pg-inicial">
        <ul>EDITAR PÁGINA INICIAL</ul>
      </a>
      }

    </div>
  </div>


</div>
